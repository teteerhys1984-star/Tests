name: Deploy exams to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Detect exam projects, build them, and assemble _site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          found=0
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              .*|.github) continue ;;   # hidden folders (incl. .github)
            esac
            if [ ! -f "$name/package.json" ]; then
              continue                  # not an exam project
            fi
            echo "::group::Build exam: $name"
            (cd "$name" && npm ci && npm run build)
            if [ ! -f "$name/dist/index.html" ]; then
              echo "::error::$name/dist/index.html was not produced by npm run build"
              exit 1
            fi
            mkdir -p "_site/$name"
            cp "$name/dist/index.html" "_site/$name/index.html"
            echo "::endgroup::"
            found=1
          done

          if [ "$found" -eq 0 ]; then
            echo "::warning::No exam projects found (no top-level folder with a package.json)."
          fi

      - name: Generate landing page (_site/index.html)
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import html
          import os
          import re
          from urllib.parse import quote

          SITE = "_site"

          grades = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع"]
          subjects = [("arabic", "اللغة العربية"), ("math", "الرياضيات"), ("physics", "الفيزياء"), ("chemistry", "الكيمياء"), ("english", "اللغة الإنجليزية")]
          exams = []
          for name in sorted(os.listdir(SITE)):
              folder = os.path.join(SITE, name)
              page = os.path.join(folder, "index.html")
              if not os.path.isdir(folder) or not os.path.isfile(page):
                  continue
              with open(page, "r", encoding="utf-8", errors="ignore") as fh:
                  content = fh.read()
              match = re.search(r"<title>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
              title = html.unescape(match.group(1)).strip() if match else name
              # The exam title is authoritative when it gives a grade/subject; folder is fallback.
              evidence = (title + " " + name).lower()
              grade_match = re.search(r"(?:الصف\s*)?(?:الصف\s*)?(الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع)\b|grade[- ]?([4-9])", evidence)
              grade_num = int(grade_match.group(2)) if grade_match and grade_match.group(2) else (grades.index(grade_match.group(1)) + 1 if grade_match else 0)
              if not grade_num:
                  continue
              if re.search(r"العربية|arabic", evidence): subject = "arabic"
              elif re.search(r"الرياضيات|رياضيات|math", evidence): subject = "math"
              elif re.search(r"الفيزياء|physics", evidence): subject = "physics"
              elif re.search(r"الكيمياء|chemistry", evidence): subject = "chemistry"
              elif re.search(r"الإنجليزية|الانجليزية|english", evidence): subject = "english"
              else: continue
              exams.append((grade_num, subject, name, title))

          cells = {}
          for grade, subject, name, title in exams:
              cells.setdefault((grade, subject), []).append((name, title))
          grade_cards = []
          for grade, grade_name in enumerate(grades, 1):
              subject_cards = []
              for key, label in subjects:
                  if key == "chemistry" and grade < 7: continue
                  items = cells.get((grade, key), [])
                  links = "".join('<li><a href="./{0}/">{1}</a></li>'.format(quote(n), html.escape(t)) for n, t in items)
                  subject_cards.append('<section class="subject"><h3>اختبارات {0}</h3>{1}</section>'.format(label, '<ul>'+links+'</ul>' if links else '<p class="empty">لا توجد اختبارات متاحة حاليًا</p>'))
              grade_cards.append('<details class="grade"><summary>الصف {0}</summary><div class="subjects">{1}</div></details>'.format(grade_name, ''.join(subject_cards)))
          listing = '<div class="grades">' + ''.join(grade_cards) + '</div>'

          html_page = """<!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>الاختبارات</title>
          <meta name="description" content="قائمة الاختبارات الإلكترونية المتاحة على هذه الصفحة." />
          <style>
            * { box-sizing: border-box; }
            body {
              margin: 0;
              font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
              line-height: 1.7;
              background: #f4f6f8;
              color: #1f2933;
            }
            .wrap { max-width: 76rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
            h1 { font-size: 1.8rem; margin: 0 0 .25rem; color: #0e2f3a; }
            .subtitle { margin: 0 0 1.5rem; color: #52616b; }
            .grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: .85rem; }
            .grade { background:#fff; border:1px solid #dce5eb; border-radius:.8rem; overflow:hidden; }
            .grade summary { cursor:pointer; list-style:none; padding:1rem 1.15rem; color:#0e5a8a; font-weight:700; font-size:1.1rem; }
            .grade summary::-webkit-details-marker { display:none; }
            .grade summary::after { content:'＋'; float:left; }
            .grade[open] summary::after { content:'−'; }
            .subjects { padding:0 .8rem .8rem; display:grid; gap:.65rem; }
            .subject { border-top:1px solid #edf1f4; padding:.55rem .25rem 0; }
            .subject h3 { font-size:.95rem; margin:.1rem 0 .35rem; color:#263c49; }
            .subject ul { list-style:none; margin:0; padding:0; display:grid; gap:.35rem; }
            .subject a { display:block; padding:.55rem .7rem; background:#f1f7fa; border-radius:.5rem; color:#0e5a8a; font-weight:600; text-decoration:none; }
            .subject a:hover { background:#e3f1f7; text-decoration:underline; }
            .empty { margin:.2rem 0 .45rem; color:#667782; font-size:.9rem; }
            @media (max-width: 480px) { .wrap { padding:1.25rem .85rem 2rem; } .grades { grid-template-columns:1fr; } }
          </style>
          </head>
          <body>
            <main class="wrap">
              <header>
                <h1>الاختبارات</h1>
                <p class="subtitle">اختر اختبارًا للبدء</p>
              </header>
          """ + listing + """
            </main>
          </body>
          </html>
          """

          with open(os.path.join(SITE, "index.html"), "w", encoding="utf-8") as fh:
              fh.write(html_page)

          print("Generated _site/index.html listing {0} exam(s): {1}".format(
              len(exams), ", ".join(name for _, _, name, _ in exams)))
          PYEOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload _site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
