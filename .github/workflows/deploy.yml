name: Deploy exams to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Detect exam projects, build them, and assemble _site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          found=0
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              .*|.github) continue ;;   # hidden folders (incl. .github)
            esac
            if [ ! -f "$name/package.json" ]; then
              continue                  # not an exam project
            fi
            echo "::group::Build exam: $name"
            (cd "$name" && npm ci && npm run build)
            if [ ! -f "$name/dist/index.html" ]; then
              echo "::error::$name/dist/index.html was not produced by npm run build"
              exit 1
            fi
            mkdir -p "_site/$name"
            cp "$name/dist/index.html" "_site/$name/index.html"
            echo "::endgroup::"
            found=1
          done

          if [ "$found" -eq 0 ]; then
            echo "::warning::No exam projects found (no top-level folder with a package.json)."
          fi

      - name: Generate landing page (_site/index.html)
        shell: bash
        run: |
          set -euo pipefail
          python3 landing/generate.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload _site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
