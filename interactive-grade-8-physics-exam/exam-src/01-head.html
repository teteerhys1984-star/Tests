<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="اختبار تفاعلي في الفيزياء للصف الثامن — الوحدة الأولى: الحركة والقوى — الدرسان 1 و2">
<title>اختبار الفيزياء — الوحدة الأولى (الدرسان 1 و2) — الصف الثامن</title>
<style>
/* ============================================================
   اختبار الفيزياء التفاعلي — الصف الثامن — الوحدة الأولى
   هوية بصرية: كحلي عميق، أزرق هادئ، تركوازي هادئ، رمادي فاتح
   ============================================================ */
:root{
  --navy:#0b2545;
  --navy-2:#13315c;
  --navy-3:#1b3f73;
  --blue:#1d5fa8;
  --blue-soft:#e8f0fa;
  --teal:#14807a;
  --teal-soft:#e3f2f1;
  --ink:#1c2733;
  --slate:#52616f;
  --bg:#eef2f7;
  --line:#d8e0ea;
  --line-strong:#b9c6d6;
  --white:#ffffff;
  --gold:#b98a1d;
  --shadow-sm:0 1px 2px rgba(11,37,69,.07),0 1px 6px rgba(11,37,69,.05);
  --shadow-md:0 6px 24px rgba(11,37,69,.10),0 2px 6px rgba(11,37,69,.06);
  --radius:14px;
  --font:"Segoe UI","Noto Kufi Arabic","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:
    linear-gradient(rgba(29,95,168,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(29,95,168,.045) 1px,transparent 1px),
    var(--bg);
  background-size:44px 44px,44px 44px,auto;
  line-height:1.85;
  min-height:100vh;
}
#app{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:var(--blue)}
[dir="ltr"],.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
bdi{unicode-bidi:isolate}

/* ---------- الترويسة والتواصل ---------- */
.contact-strip{
  background:var(--navy);
  color:#dbe6f4;
  font-size:13px;
  padding:7px 16px;
  display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
}
.contact-strip a{color:#9fd7d2;text-decoration:none;font-weight:600}
.contact-strip a:hover{text-decoration:underline}
.contact-strip svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:4px}
.page-footer{
  margin-top:auto;background:var(--navy);color:#c8d6e8;text-align:center;
  padding:18px 14px;font-size:13px;line-height:1.9;
}
.page-footer a{color:#9fd7d2;text-decoration:none}
.page-footer .foot-line{opacity:.85}
.page-footer .foot-brand{font-weight:700;color:#eef4fb;font-size:14px}

/* ---------- الهيكل العام ---------- */
.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 34px;width:100%}
.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}

/* ---------- شاشة الترحيب ---------- */
.hero{
  background:radial-gradient(1200px 480px at 78% -10%,rgba(20,128,122,.28),transparent 60%),
             radial-gradient(900px 420px at 12% 110%,rgba(29,95,168,.30),transparent 60%),
             linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 58%,#0e2c50 100%);
  border-radius:20px;color:#f4f8fd;padding:38px 34px 30px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(200deg,black 0%,transparent 68%);
  -webkit-mask-image:linear-gradient(200deg,black 0%,transparent 68%);
}
.hero-deco{position:absolute;inset-inline-start:-30px;bottom:-40px;width:340px;height:340px;opacity:.14;pointer-events:none}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(159,215,210,.14);border:1px solid rgba(159,215,210,.4);
  color:#b9e6e1;font-size:13px;font-weight:600;border-radius:999px;padding:5px 14px;position:relative}
.hero-kicker svg{width:14px;height:14px;flex:none}
.hero h1{font-size:clamp(24px,4.2vw,36px);margin:14px 0 6px;font-weight:800;letter-spacing:-.2px;position:relative}
.hero .hero-sub{color:#c9d8ec;font-size:15px;max-width:640px;position:relative}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.hero-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  padding:8px 14px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.hero-chip svg{width:16px;height:16px;color:#8fd4ce;flex:none}
.hero-chip b{color:#fff;font-weight:700}

.welcome-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:20px}
@media(max-width:900px){.welcome-grid{grid-template-columns:1fr}}
.panel{padding:22px 22px}
.panel h2{margin:0 0 12px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:9px}
.panel h2 svg{width:19px;height:19px;color:var(--teal)}
.rules-list{margin:0;padding:0;list-style:none}
.rules-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;color:var(--ink)}
.rules-list li:last-child{border-bottom:none}
.rules-list svg{width:16px;height:16px;color:var(--blue);flex:none;margin-top:7px}
.num-chip{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:4px}

.name-row{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.name-row label{font-weight:700;font-size:14px;color:var(--navy)}
.name-input{
  border:1.6px solid var(--line-strong);border-radius:11px;padding:12px 14px;font-size:16px;
  background:#fbfdff;transition:border-color .15s,box-shadow .15s;width:100%;
}
.name-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,168,.15)}
.name-error{color:#b3261e;font-size:13px;font-weight:600;min-height:20px;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:700;transition:transform .08s,box-shadow .15s,background .15s,opacity .15s;
}
.btn svg{width:17px;height:17px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--blue),#1a5496);color:#fff;box-shadow:0 4px 14px rgba(29,95,168,.35)}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 18px rgba(29,95,168,.45)}
.btn-teal{background:linear-gradient(135deg,var(--teal),#0f6a64);color:#fff;box-shadow:0 4px 14px rgba(20,128,122,.3)}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line-strong)}
.btn-ghost:hover:not(:disabled){background:#f6f9fc}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-block{width:100%}
.btn-lg{padding:14px 28px;font-size:16px;border-radius:13px}

.teacher-link-row{margin-top:16px;text-align:center}
.teacher-link{background:none;border:none;color:var(--slate);font-size:13px;display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:8px}
.teacher-link:hover{color:var(--navy);background:var(--blue-soft)}
.teacher-link svg{width:14px;height:14px}

/* ---------- شريط الاختبار العلوي ---------- */
.exam-top{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(11,37,69,.05);
}
.exam-top-inner{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.exam-title-chip{font-weight:800;color:var(--navy);font-size:15px}
.stopwatch{
  display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;
  padding:6px 13px;font-weight:700;font-size:15px;
}
.stopwatch svg{width:15px;height:15px;color:#9fd7d2}
.stopwatch .sw-digits{font-variant-numeric:tabular-nums;letter-spacing:1px}
.progress-wrap{flex:1;min-width:150px}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);font-weight:600;margin-bottom:4px}
.progress-bar{height:8px;background:#e3e9f1;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue));width:0%;transition:width .3s}
.name-tag{font-size:13px;color:var(--slate);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.name-tag b{color:var(--navy)}
.name-tag svg{width:15px;height:15px;color:var(--teal)}

/* ---------- تخطيط الاختبار ---------- */
.exam-layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.exam-layout{grid-template-columns:1fr}}
.palette{padding:14px;position:sticky;top:74px}
@media(max-width:900px){.palette{position:static}}
.palette h3{margin:0 0 10px;font-size:13.5px;color:var(--navy);font-weight:800}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
@media(max-width:900px){.palette-grid{grid-template-columns:repeat(8,1fr)}}
@media(max-width:560px){.palette-grid{grid-template-columns:repeat(5,1fr)}}
.pal-btn{
  border:1.5px solid var(--line-strong);background:#fff;border-radius:9px;height:36px;font-size:13.5px;font-weight:700;color:var(--slate);
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.pal-btn:hover{border-color:var(--blue);color:var(--blue)}
.pal-btn.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.pal-btn.partial{background:#fdf6e4;border-color:var(--gold);color:#8a6512}
.pal-btn.current{outline:2.5px solid var(--blue);outline-offset:1px;color:var(--navy);font-weight:800}
.palette-legend{font-size:11.5px;color:var(--slate);margin-top:10px;line-height:2}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.ld-done{background:var(--teal)}.ld-part{background:var(--gold)}.ld-empty{background:#fff;border:1.5px solid var(--line-strong)}

/* ---------- بطاقة السؤال ---------- */
.question-card{padding:26px 26px 22px}
@media(max-width:640px){.question-card{padding:18px 16px}}
.q-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.q-badge{
  background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border-radius:12px;padding:8px 16px;
  font-size:15px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow-sm);
}
.q-marks{margin-inline-start:auto;background:var(--blue-soft);color:var(--navy);border:1px solid #c5d7ee;border-radius:10px;
  padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap}
.q-lead{font-size:15.5px;font-weight:600;color:var(--ink);margin:10px 0 4px;line-height:2}
.q-figure{margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;padding:14px;overflow-x:auto}
.q-figure svg{display:block;margin:0 auto;max-width:100%;height:auto}
.q-figure figcaption{font-size:12.5px;color:var(--slate);text-align:center;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

.part-card{
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px;background:#fdfeff;
}
.part-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.part-label{
  background:var(--navy);color:#fff;width:30px;height:30px;border-radius:9px;font-weight:800;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.part-marks{font-size:12px;color:var(--teal);font-weight:800;background:var(--teal-soft);border-radius:8px;padding:2px 9px}
.part-text{font-size:14.5px;font-weight:600;line-height:2;flex:1;min-width:240px}

.opt-row{
  display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:9px;
  cursor:pointer;transition:border-color .12s,background .12s;background:#fff;
}
.opt-row:hover{border-color:var(--blue);background:#f7fafd}
.opt-row.checked{border-color:var(--teal);background:var(--teal-soft)}
.opt-row input{margin-top:6px;accent-color:var(--teal);width:17px;height:17px;flex:none;cursor:pointer}
.opt-code{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--navy);
  font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-top:2px;
}
.opt-text{font-size:14px;line-height:1.95;flex:1}

.tf-row{display:flex;gap:10px;flex-wrap:wrap}
.tf-opt{
  flex:1;min-width:120px;border:1.5px solid var(--line-strong);border-radius:11px;background:#fff;padding:11px;
  display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:15px;color:var(--slate);cursor:pointer;transition:all .12s;
}
.tf-opt:hover{border-color:var(--blue);color:var(--blue)}
.tf-opt.checked{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.tf-opt input{accent-color:var(--teal);width:16px;height:16px;cursor:pointer}

.numeric-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.numeric-input{
  border:1.6px solid var(--line-strong);border-radius:10px;padding:10px 14px;font-size:17px;width:180px;
  direction:ltr;text-align:center;font-weight:700;background:#fbfdff;font-variant-numeric:tabular-nums;
}
.numeric-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,168,.14)}
.unit-badge{background:var(--navy);color:#fff;border-radius:9px;padding:7px 13px;font-weight:800;font-size:14px;direction:ltr}
.num-format-note{font-size:12px;color:var(--slate);width:100%}

.ord-item,.match-row{
  display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:9px;background:#fff;flex-wrap:wrap;
}
.ord-item .ord-text,.match-row .match-field{flex:1;font-size:14px;line-height:1.9;min-width:200px;font-weight:600}
.ord-select,.match-select{
  border:1.5px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:14px;background:#fbfdff;font-weight:700;color:var(--navy);
  min-width:120px;
}
.ord-select:focus,.match-select:focus{outline:none;border-color:var(--blue)}
.match-arrow{color:var(--slate);font-size:16px;flex:none}

/* ---------- أزرار التنقل ---------- */
.nav-bar{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center}
.nav-bar .spacer{flex:1}
.submit-hint{font-size:13px;color:var(--slate);font-weight:600;width:100%;text-align:center;margin-top:2px}
.submit-hint b{color:#b3261e}

/* ---------- شاشة المراجعة ---------- */
.review-row{
  display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 15px;margin-top:9px;background:#fff;
}
.review-row .rv-num{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.review-row .rv-state{flex:1;font-size:13.5px;font-weight:600;color:var(--slate)}
.review-row .rv-state b{color:var(--navy)}
.review-row .rv-jump{font-size:13px;padding:7px 14px}
.state-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 11px}
.state-ok{background:var(--teal-soft);color:var(--teal)}
.state-part{background:#fdf6e4;color:#8a6512}
.state-none{background:#f1f4f8;color:var(--slate)}

/* ---------- شاشة النتائج ---------- */
.results-hero{
  background:linear-gradient(150deg,var(--navy),var(--navy-2));border-radius:20px;color:#fff;padding:30px;text-align:center;
  box-shadow:var(--shadow-md);position:relative;overflow:hidden;
}
.results-hero::before{content:"";position:absolute;inset:0;opacity:.12;
  background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
  background-size:34px 34px;pointer-events:none}
.score-ring{
  width:172px;height:172px;border-radius:50%;margin:16px auto 6px;position:relative;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--teal) 0deg,rgba(255,255,255,.14) 0deg);
}
.score-ring::before{content:"";position:absolute;inset:11px;background:var(--navy-2);border-radius:50%}
.score-ring .score-inner{position:relative;text-align:center}
.score-num{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;line-height:1.1}
.score-num span{font-size:16px;color:#b8cbdf;font-weight:600}
.score-pct{font-size:14px;color:#9fd7d2;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 12px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .stat-num{font-size:25px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3}
.stat-card .stat-label{font-size:12.5px;color:var(--slate);font-weight:700}
.stat-card.ok .stat-num{color:var(--teal)}
.stat-card.warn .stat-num{color:var(--gold)}
.stat-card.bad .stat-num{color:#b3261e}
.results-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.report-note{font-size:12.5px;color:var(--slate);text-align:center;margin-top:12px}

/* ---------- منطقة المعلم ---------- */
.gate-box{max-width:420px;margin:26px auto;padding:26px;text-align:center}
.gate-box h2{margin:6px 0 4px;color:var(--navy);font-size:18px}
.gate-box p{color:var(--slate);font-size:13.5px;margin:0 0 14px}
.lock-icon{width:52px;height:52px;border-radius:16px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;margin:0 auto}
.lock-icon svg{width:26px;height:26px;color:var(--blue)}
.tk-q{border:1px solid var(--line);border-radius:14px;margin-top:16px;overflow:hidden;background:#fff}
.tk-q-head{background:linear-gradient(135deg,#f4f8fc,#eef4fa);padding:13px 17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tk-q-num{background:var(--navy);color:#fff;border-radius:9px;padding:4px 13px;font-weight:800;font-size:13.5px}
.tk-tag{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.tk-lesson1{background:var(--blue-soft);color:var(--blue)}
.tk-lesson2{background:var(--teal-soft);color:var(--teal)}
.tk-diff{background:#f3eefb;color:#6d4fa3}
.tk-page{background:#f1f4f8;color:var(--slate)}
.tk-marks{background:#fdf6e4;color:#8a6512}
.tk-body{padding:15px 18px}
.tk-part{border-inline-start:3px solid var(--blue);background:#fbfdff;border-radius:9px;padding:12px 15px;margin-top:12px}
.tk-part .tkp-text{font-weight:700;font-size:14px;margin:0 0 8px}
.tk-kv{font-size:13px;margin:5px 0;line-height:2}
.tk-kv b{color:var(--navy)}
.tk-answer{background:var(--teal-soft);border-radius:8px;padding:7px 12px;display:block;font-weight:700;color:#0d5f5a}
.tk-sol{background:#f6f8fb;border:1px dashed var(--line-strong);border-radius:9px;padding:10px 13px;margin-top:8px;font-size:13px}
.tk-sol b{color:var(--navy)}
.rubric-card{padding:20px 22px;margin-top:16px}
.rubric-card h3{margin:0 0 8px;color:var(--navy);font-size:15.5px;display:flex;align-items:center;gap:8px}
.rubric-card h3 svg{width:18px;height:18px;color:var(--teal);flex:none}
.rubric-card ul{margin:0;padding-inline-start:20px;font-size:13.5px}
.rubric-card li{margin:5px 0}

section h2 svg{width:19px;height:19px;flex:none;vertical-align:-3px;color:var(--teal)}
.hero h1{display:block}

/* ---------- تنبيهات عامة ---------- */
.storage-warn{
  max-width:1060px;margin:10px auto 0;padding:9px 16px;background:#fdf6e4;border:1px solid #ecd28a;color:#8a6512;
  border-radius:11px;font-size:13px;font-weight:700;display:flex;gap:9px;align-items:center;width:calc(100% - 32px);
}
.storage-warn svg{width:16px;height:16px;flex:none}
.modal-back{position:fixed;inset:0;background:rgba(11,37,69,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.modal{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:24px;box-shadow:var(--shadow-md)}
.modal h3{margin:0 0 8px;color:var(--navy);font-size:16.5px}
.modal p{font-size:13.5px;color:var(--slate);margin:0 0 14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.formula{
  direction:ltr;display:inline-block;background:#f1f6fb;border:1px solid var(--line);border-radius:8px;
  padding:1px 9px;font-weight:700;color:var(--navy);font-size:14px;white-space:nowrap;unicode-bidi:isolate;
}
.sub{font-size:.72em;vertical-align:sub}
sup{font-size:.72em}
.screen{display:none}
.screen.active{display:block}
.text-center{text-align:center}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.small{font-size:12.5px;color:var(--slate)}
hr.sep{border:none;border-top:1px dashed var(--line);margin:18px 0}
@media print{.exam-top,.contact-strip,.page-footer,.nav-bar,.palette{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<noscript><p style="padding:40px;text-align:center;font-family:sans-serif">هذا الاختبار يتطلب تفعيل JavaScript في المتصفح.</p></noscript>
